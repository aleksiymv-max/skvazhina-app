name: Promysel fast source validation
on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'server/**'
      - '.github/workflows/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'neftyanik_v1.24.1_stable_hotfix.zip'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - 'server/**'
      - '.github/workflows/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'neftyanik_v1.24.1_stable_hotfix.zip'
      - '!**/*.md'
permissions:
  contents: read
concurrency:
  group: promysel-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax checks (no Flutter, Android SDK or apt)
        run: python3 -m compileall -q tools server
      - name: Critical registration and approval regressions
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/server${PYTHONPATH:+:$PYTHONPATH}"
          python3 server/test_approval_before_invitation.py
          python3 server/test_registration_password_reinvite_v212.py
          python3 server/test_registration_rules.py
          python3 server/test_registration_decisions.py
          python3 server/test_registration_service.py
          python3 server/test_promysel_sync_cursor_v210.py
      - name: Validate Supabase Edge Function TypeScript syntax (no deployment)
        run: |
          set -euo pipefail
          npx --yes esbuild@0.25.12 supabase/functions/promysel-compat/index.ts --bundle --platform=neutral '--external:npm:*' --outfile=/tmp/promysel-compat-syntax.js
          test -s /tmp/promysel-compat-syntax.js
          node tools/test_promysel_avatar_transport_v213.js
          npx --yes esbuild@0.25.12 supabase/functions/promysel-device-push/index.ts --bundle --platform=neutral '--external:npm:*' --outfile=/tmp/promysel-device-push-syntax.js
          test -s /tmp/promysel-device-push-syntax.js
      - name: Check workflow safety policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in ('web-ios.yml','stability-preflight.yml'):
              s=(Path('.github/workflows')/p).read_text()
              assert 'workflow_dispatch:' in s and '  schedule:' not in s,p
              if p=='web-ios.yml':
                  assert "deploy/ci/web-v191-build.trigger" in s, 'Web push must be narrowly scoped'
              else:
                  assert '  push:' not in s,p
          promotion=Path('.github/workflows/promysel-promote-stable.yml').read_text()
          assert 'cancel-in-progress: false' in promotion
          assert 'environment: production' in promotion
          assert not Path('.github/workflows/android.yml').exists(), 'Android APK build must be disabled'
          assert Path('tools/archive/android-build.workflow.yml.txt').exists()
          print('PASS: Web manual, Android source-only, stable deployment serialized')
          PY
      - name: Verify Web and Android source parity (no APK build)
        run: python3 tools/check_promysel_android_source_sync.py
