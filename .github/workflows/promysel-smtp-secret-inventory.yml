name: One-shot SMTP secret key inventory (names only)

on:
  push:
    branches: [main]
    paths:
      - 'deploy/ci/smtp-secret-inventory.trigger'

permissions:
  contents: read

jobs:
  names-only:
    if: github.repository == 'aleksiymv-max/skvazhina-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SECRET_CONTEXT_JSON: ${{ toJSON(secrets) }}
    steps:
      - name: Print SMTP-related secret NAMES ONLY (never values)
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, re
          data=json.loads(os.environ.get('SECRET_CONTEXT_JSON','{}'))
          keys=sorted(str(k) for k in data.keys())
          matched=[k for k in keys if re.search(r'(SMTP|MAIL|EMAIL|GMAIL|SUPABASE|PAT|TOKEN)',k,re.I)]
          print('REPOSITORY_OR_ORGANIZATION_SMTP_SECRET_NAMES_ONLY:',','.join(matched) or '(none)')
          print('OTHER_SECRET_COUNT:',len(keys)-len(matched))
          print('GITHUB_WORKFLOW_SECRETS_AVAILABLE:', 'yes' if len(keys)>0 else 'no')
          PY
