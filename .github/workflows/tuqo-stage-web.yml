name: Stage verified Promysel Web for TUQO
on:
  push:
    branches: [main]
    paths:
      - 'deploy/ci/tuqo-release.trigger'
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful GitHub Web build run ID
        required: true
        type: string
      confirmation:
        description: Enter STAGE to replace TUQO production branch contents
        required: true
        type: string
      version:
        description: Release version, e.g. v2.09
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: promysel-tuqo-stage
  cancel-in-progress: false
jobs:
  stage:
    if: ${{ github.event_name == 'push' || inputs.confirmation == 'STAGE' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout explicit production release request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify successful original Web build
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            test -f deploy/ci/tuqo-release.trigger
            RUN_ID="$(sed -n 's/^run_id=//p' deploy/ci/tuqo-release.trigger)"
            EXPECTED_SHA="$(sed -n 's/^source_sha=//p' deploy/ci/tuqo-release.trigger)"
            RELEASE_VERSION="$(sed -n 's/^version=//p' deploy/ci/tuqo-release.trigger)"
          else
            RUN_ID="$INPUT_RUN_ID"
            EXPECTED_SHA=""
            RELEASE_VERSION="$INPUT_VERSION"
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+$ ]]
          if [[ -n "$EXPECTED_SHA" ]]; then [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; fi
          gh api "repos/$REPO/actions/runs/$RUN_ID" > /tmp/build.json
          jq -e '.conclusion=="success" and .name=="Build Promysel Web for iPhone" and .head_branch=="main" and .event!="pull_request"' /tmp/build.json
          SOURCE_SHA="$(jq -r .head_sha /tmp/build.json)"
          if [[ -n "$EXPECTED_SHA" && "$SOURCE_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Source SHA of run does not match authorized release request"
            exit 1
          fi
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Download exact verified artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RELEASE_RUN_ID }}
          name: promysel-original-flutter-supabase-web
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifact
      - name: Validate production files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/promysel-tuqo-web
          unzip -q artifact/promysel-original-flutter-supabase-web.zip -d /tmp/promysel-tuqo-web
          cd /tmp/promysel-tuqo-web
          for f in index.html main.dart.js flutter_bootstrap.js manifest.json finish-registration.html sqflite_sw.js; do test -s "$f"; done
          ! grep -q 'id="promysel-dev-mark"' index.html
          test ! -e .git
          jq -n --arg version "$RELEASE_VERSION" --arg source_sha "$SOURCE_SHA" \
            --argjson build_run_id "$RELEASE_RUN_ID" \
            '{version:$version,source_sha:$source_sha,build_run_id:$build_run_id}' \
            > promysel-release.json
          echo "Validated original production Web artifact"
      - name: Replace TUQO branch with static Web site
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/promysel-tuqo-web
          git init -b tuqo-production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promysel TUQO Web release from $SOURCE_SHA"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push --force origin HEAD:refs/heads/tuqo-production
          echo "::notice title=TUQO candidate staged::Production files pushed to tuqo-production; TUQO auto-deploy must remain disabled until user publishes"
