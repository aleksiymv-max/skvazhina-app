          python3 - <<'PY'
          from pathlib import Path
          import re,json
          p=Path('web/index.html');s=p.read_text();s=s.replace('<title>promysel</title>','<title>Промысел</title>')
          if 'apple-mobile-web-app-capable' not in s:s=s.replace('</head>','  <meta name="apple-mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-status-bar-style" content="default">\n  <meta name="apple-mobile-web-app-title" content="Промысел">\n  <link rel="apple-touch-icon" href="apple-touch-icon.png">\n</head>')
          elif 'apple-touch-icon' not in s:s=s.replace('</head>','  <link rel="apple-touch-icon" href="apple-touch-icon.png">\n</head>')
          p.write_text(s)
          m=Path('web/manifest.json');x=json.loads(m.read_text());x['name']='Промысел';x['short_name']='Промысел';x['display']='standalone';x['background_color']='#071425';x['theme_color']='#0B4F91';m.write_text(json.dumps(x,ensure_ascii=False,indent=2))
          main=Path('lib/main.dart');src=main.read_text();web_import="import 'package:sqflite_common_ffi_web/sqflite_ffi_web.dart';\n";sq_import="import 'package:sqflite/sqflite.dart';\n";foundation_import="import 'package:flutter/foundation.dart';\n"
          if web_import not in src:src=web_import+sq_import+foundation_import+src
          pattern=r'((?:Future<\s*void\s*>|void)\s+main\s*\([^)]*\)\s*(?:async\s*)?\{)';match=re.search(pattern,src)
          if not match:raise SystemExit('ERROR: main() not found')
          init="\n  if (kIsWeb) {\n    databaseFactory = databaseFactoryFfiWeb;\n  }\n"
          if 'databaseFactory = databaseFactoryFfiWeb;' not in src:src=src[:match.end()]+init+src[match.end():]
