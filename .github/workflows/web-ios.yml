          flutter build web --no-pub --release --pwa-strategy=offline-first --dart-define=PROMYSEL_SYNC_URL=https://xptmcufhuvtcunqzlsme.supabase.co/functions/v1/promysel-compat
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_web_push.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_cellular_startup_v201.py"
          python3 "$GITHUB_WORKSPACE/tools/test_promysel_cellular_startup_v201.py"
          # Debug symbols are not loaded at runtime; avoid shipping multi-MB maps on slow links.
          find build/web/canvaskit -type f -name '*.symbols' -delete
          test -f build/web/diagnostics.html;          test -f build/web/index.html;test -f build/web/flutter_bootstrap.js;test -f build/web/manifest.json;test -f build/web/sqlite3.wasm;test -f build/web/sqflite_sw.js;test -f build/web/apple-touch-icon.png
      - name: Add first-run account setup and Cloudflare hosting metadata
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.project.outputs.project_dir }}/build/web"
          test -f "$GITHUB_WORKSPACE/docs/index.html"
          # The original Flutter UI remains at /; the setup page is used only
          # to register the first administrator and manage account onboarding.
          cp "$GITHUB_WORKSPACE/docs/index.html" "$OUT/setup.html"
          cp "$GITHUB_WORKSPACE/docs/admin-setup.html" "$OUT/activate-admin.html"
          cp "$GITHUB_WORKSPACE/docs/finish-registration.html" "$OUT/finish-registration.html"
          cat > "$OUT/_headers" <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            X-Frame-Options: DENY
          /index.html
            Cache-Control: no-cache
          /main.dart.js
            Cache-Control: no-cache
          /flutter_bootstrap.js
            Cache-Control: no-cache
          /promysel-push-sw.js
            Cache-Control: no-cache
          /diagnostics.html
            Cache-Control: no-store
          /setup.html
            Cache-Control: no-cache
          /finish-registration.html
            Cache-Control: no-store
          EOF
          test -f "$OUT/index.html"
          test -f "$OUT/setup.html"
          test -f "$OUT/activate-admin.html"
          test -f "$OUT/finish-registration.html"
      - name: Probe existing Tuqo site and backend DNS HTTPS (external GitHub network only)
        shell: bash
        continue-on-error: true
        run: |
          for URL in "https://promysel-app.tuqo.app/" "https://promysel-app.tuqo.ru/" "https://xptmcufhuvtcunqzlsme.supabase.co/functions/v1/promysel-compat/health"; do
            echo "PROBE $URL"
            curl --location --silent --show-error --connect-timeout 6 --max-time 14 -o /dev/null -w 'HTTP=%{http_code} DNS=%{time_namelookup}s TCP=%{time_connect}s TLS=%{time_appconnect}s FIRST=%{time_starttransfer}s TOTAL=%{time_total}s IP=%{remote_ip}\n' "$URL" || echo "PROBE_UNREACHABLE"
          done
      - name: Package iPhone web app
        shell: bash
        run: |
          set -euo pipefail;cd "${{ steps.project.outputs.project_dir }}";mkdir -p "$GITHUB_WORKSPACE/artifacts";(cd build/web && zip -qr "$GITHUB_WORKSPACE/artifacts/promysel-original-flutter-supabase-web.zip" .);sha256sum "$GITHUB_WORKSPACE/artifacts/promysel-original-flutter-supabase-web.zip"
      # Artifacts are optional: exhausted artifact storage must not block the live iPhone deployment.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: {name: promysel-original-flutter-supabase-web, path: artifacts/promysel-original-flutter-supabase-web.zip, retention-days: 7}
      - name: Confirm Cloudflare-ready root structure
        shell: bash
        run: |
          set -euo pipefail
          unzip -Z1 artifacts/promysel-original-flutter-supabase-web.zip | grep -qx index.html
          unzip -Z1 artifacts/promysel-original-flutter-supabase-web.zip | grep -qx main.dart.js
          unzip -Z1 artifacts/promysel-original-flutter-supabase-web.zip | grep -qx sqflite_sw.js
          unzip -Z1 artifacts/promysel-original-flutter-supabase-web.zip | grep -qx setup.html
          unzip -Z1 artifacts/promysel-original-flutter-supabase-web.zip | grep -qx activate-admin.html
          unzip -Z1 artifacts/promysel-original-flutter-supabase-web.zip | grep -qx finish-registration.html
          echo 'Verified Web artifact before optional DEV publish'
      - name: Publish development preview only (stable production remains frozen)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error title=Cloudflare not configured::Add GitHub Actions secret CLOUDFLARE_API_TOKEN (Pages Edit permission)."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error title=Cloudflare not configured::Add GitHub Actions secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          test -f "${{ steps.project.outputs.project_dir }}/build/web/finish-registration.html"
          # Visible label only in live development preview, never in the releasable ZIP.
          python3 - <<'PY'
          from pathlib import Path
          root=Path("${{ steps.project.outputs.project_dir }}/build/web")
          index=root/"index.html"
          html=index.read_text(encoding="utf-8")
          badge='''<style>#promysel-dev-mark{position:fixed;top:env(safe-area-inset-top,0px);right:8px;z-index:2147483647;background:#0b4f91;color:white;padding:4px 9px;border-radius:0 0 9px 9px;font:600 10px/1.4 sans-serif;letter-spacing:.06em;pointer-events:none;opacity:.95}</style><div id="promysel-dev-mark" aria-label="Тестовая версия">РАЗРАБОТКА</div>'''
          assert "</body>" in html
          index.write_text(html.replace("</body>",badge+"</body>"),encoding="utf-8")
          PY
          npx --yes wrangler@4 pages deploy "${{ steps.project.outputs.project_dir }}/build/web" --project-name=promysel-web --branch=dev
          echo "::notice title=DEV preview deployed::Published commit ${GITHUB_SHA} to dev.promysel-web.pages.dev. Stable promysel-web.pages.dev was NOT modified."
