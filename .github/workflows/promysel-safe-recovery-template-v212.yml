name: One-shot protect repeat Promysel recovery email URLs
on:
  push:
    branches: [main]
    paths:
      - 'deploy/ci/safe-recovery-template-v212.trigger'
permissions:
  contents: read
jobs:
  protect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and update Supabase recovery links without sending mail
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          SUPABASE_PERSONAL_ACCESS_TOKEN: ${{ secrets.SUPABASE_PERSONAL_ACCESS_TOKEN }}
          SB_ACCESS_TOKEN: ${{ secrets.SB_ACCESS_TOKEN }}
          SB_MANAGEMENT_TOKEN: ${{ secrets.SB_MANAGEMENT_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m py_compile infra/smtp/configure_safe_recovery_template_v212.py
          python3 infra/smtp/configure_safe_recovery_template_v212.py
