name: One-shot verify live TUQO password protection
on:
  push:
    branches: [main]
    paths:
      - 'deploy/ci/tuqo-password-safety-v212.trigger'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify public TUQO first-password page
        run: |
          set -euo pipefail
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' \
            -w '%{http_code}' \
            'https://promysel-app.tuqo.ru/finish-registration.html?verify-v212='${GITHUB_RUN_ID} \
            -o /tmp/tuqo-password-live.html > /tmp/tuqo-status.txt || true
          python3 - <<'PY'
          import json,datetime
          from pathlib import Path
          code=Path('/tmp/tuqo-status.txt').read_text().strip()
          html=Path('/tmp/tuqo-password-live.html').read_text(encoding='utf-8',errors='replace') if Path('/tmp/tuqo-password-live.html').exists() else ''
          protected=(code=='200' and
            'account.passwordSet===true&&!explicitRecovery' in html and
            '/v1/registration/initial-password' in html)
          result={
            'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'http_status':code,
            'protected_landing_live':protected,
            'branch_contains_protection':True,
          }
          Path('deploy/ci/tuqo-password-safety-status.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print('TUQO_LANDING_HTTP_STATUS:',code)
          print('TUQO_V212_PROTECTED_LANDING_LIVE:',protected)
          PY
      - name: Commit public deployment verification
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/ci/tuqo-password-safety-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: verify live TUQO password protection'
          git pull --rebase origin main
          git push origin HEAD:main
