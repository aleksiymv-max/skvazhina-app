name: Build Нефтяник APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: neftyanik-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Сборка Нефтяник Android
    runs-on: ubuntu-latest

    steps:
      - name: Получить проект
        uses: actions/checkout@v4

      - name: Распаковать текущую версию
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/neftyanik_v1.24.1_stable_hotfix.zip"
          test -f "$ZIP_FILE"

          EXTRACT_DIR="$RUNNER_TEMP/neftyanik_project"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          PROJECT_DIR="$(find "$EXTRACT_DIR" -type f -name pubspec.yaml -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/pubspec.yaml"

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          echo "Flutter project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Показать версию Flutter
        run: flutter --version

      - name: Создать Android и установить launcher icon
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"

          ICON="assets/icon/app_icon.png"
          test -f "$ICON"
          file "$ICON"
          echo "SHA256 исходной иконки:"
          sha256sum "$ICON"

          rm -rf android
          flutter create --platforms=android --project-name neftyanik --org ru.oilman .

          # Flutter create генерирует стандартную иконку. Заменяем ее ПОСЛЕ flutter create.
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          declare -A sizes=(
            [mdpi]=48
            [hdpi]=72
            [xhdpi]=96
            [xxhdpi]=144
            [xxxhdpi]=192
          )

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            if command -v convert >/dev/null 2>&1; then
              convert "$ICON" -resize "${sizes[$density]}x${sizes[$density]}" "$dir/ic_launcher.png"
              cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            else
              cp "$ICON" "$dir/ic_launcher.png"
              cp "$ICON" "$dir/ic_launcher_round.png"
            fi
          done

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          sed -i 's#android:icon="[^"]*"#android:icon="@mipmap/ic_launcher"#' "$MANIFEST"
          if grep -q 'android:roundIcon=' "$MANIFEST"; then
            sed -i 's#android:roundIcon="[^"]*"#android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"
          else
            sed -i 's#<application#<application android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"
          fi

          echo "Launcher resources:"
          find android/app/src/main/res -type f \( -name 'ic_launcher.png' -o -name 'ic_launcher_round.png' \) -print -exec sha256sum {} \;
          grep -n 'android:icon\|android:roundIcon' "$MANIFEST"

      - name: Установить зависимости
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          flutter clean
          flutter pub get

      - name: Собрать APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"

          flutter build apk --release
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"

          echo "Проверяем launcher icon внутри готового APK:"
          unzip -l "$APK" | grep -E 'res/.*/ic_launcher|mipmap.*/ic_launcher' || true

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/neftyanik-v1.24.1-release.apk"
          sha256sum "$GITHUB_WORKSPACE/artifacts/neftyanik-v1.24.1-release.apk"

      - name: Опубликовать APK
        uses: actions/upload-artifact@v4
        with:
          name: neftyanik-v1.24.1-android
          path: artifacts/neftyanik-v1.24.1-release.apk
          if-no-files-found: error
          retention-days: 30
