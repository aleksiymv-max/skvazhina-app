name: Build Promysel APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: promysel-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Promysel Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract base source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/neftyanik_v1.24.1_stable_hotfix.zip"
          DIR="$RUNNER_TEMP/promysel"
          rm -rf "$DIR" && mkdir -p "$DIR"
          unzip -q "$SRC" -d "$DIR"
          PROJECT="$(dirname "$(find "$DIR" -name pubspec.yaml -print -quit)")"
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Install image tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin

      - name: Apply Promysel updates
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v125.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v126.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v127.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v128.py"
          cat > /tmp/promysel.svg <<'SVG'
                    <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
          <defs><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D5A8F"/><stop offset="1" stop-color="#001A3D"/></linearGradient><linearGradient id="b" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#0757C9"/><stop offset="1" stop-color="#178BE6"/></linearGradient></defs>
          <rect x="28" y="28" width="968" height="968" rx="220" fill="#FFFFFF"/>
          <path d="M356 112C315 224 214 352 180 478c-47 176 37 346 199 397 77 24 155 13 220-24-111-38-190-144-190-270 0-144 73-285 185-438-78 10-164 42-238  -31z" fill="url(#n)"/>
          <path d="M262 750C302 552 395 337 566 148 429 365 354 563 344 750z" fill="#FFFFFF"/>
          <g fill="url(#b)"><rect x="470" y="660" width="92" height="190" rx="14"/><rect x="590" y="550" width="92" height="300" rx="14"/><rect x="710" y="410" width="92" height="440" rx="14"/><rect x="830" y="270" width="92" height="580" rx="14"/></g>
          </svg>
          SVG
          convert /tmp/promysel.svg -resize 1024x1024 assets/icon/app_icon.png
          cp assets/icon/app_icon.png assets/icon/app_icon_foreground.png
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          zip -qr "$GITHUB_WORKSPACE/artifacts/promysel-v1.28.0-source.zip" . -x 'android/*' 'build/*' '.dart_tool/*'
          unzip -t "$GITHUB_WORKSPACE/artifacts/promysel-v1.28.0-source.zip" >/dev/null

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies and analyze
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          rm -rf android
          flutter create --platforms=android --project-name promysel --org ru.promysel .
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' android/app/src/main/kotlin/ru/promysel/promysel/MainActivity.kt
          sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' android/app/src/main/kotlin/ru/promysel/promysel/MainActivity.kt
          sed -i '/<manifest/a\\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          sed -i 's/android:label="[^"]*"/android:label="Промысел"/' "$MANIFEST"
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          declare -A sizes=([mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192)
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            out="android/app/src/main/res/mipmap-$d"; mkdir -p "$out"
            convert assets/icon/app_icon.png -resize "${sizes[$d]}x${sizes[$d]}" "$out/ic_launcher.png"
            cp "$out/ic_launcher.png" "$out/ic_launcher_round.png"
          done
          sed -i 's#android:icon="[^"]*"#android:icon="@mipmap/ic_launcher"#' "$MANIFEST"
          if grep -q 'android:roundIcon=' "$MANIFEST"; then sed -i 's#android:roundIcon="[^"]*"#android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"; else sed -i 's#<application#<application android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"; fi

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/artifacts/promysel-v1.28.0-release.apk"
          unzip -t "$GITHUB_WORKSPACE/artifacts/promysel-v1.28.0-release.apk" >/dev/null
          sha256sum "$GITHUB_WORKSPACE/artifacts/promysel-v1.28.0-release.apk"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: promysel-v1.28.0-source
          path: artifacts/promysel-v1.28.0-source.zip
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: promysel-v1.28.0-android
          path: artifacts/promysel-v1.28.0-release.apk
          retention-days: 30
