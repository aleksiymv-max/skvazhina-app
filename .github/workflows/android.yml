name: Build Promysel APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: promysel-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Promysel Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract base source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/neftyanik_v1.24.1_stable_hotfix.zip"
          DIR="$RUNNER_TEMP/promysel"
          rm -rf "$DIR" && mkdir -p "$DIR"
          unzip -q "$SRC" -d "$DIR"
          PROJECT="$(dirname "$(find "$DIR" -name pubspec.yaml -print -quit)")"
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Install image tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin

      - name: Apply Promysel updates
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v125.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v126.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v127.py"
          cat > /tmp/promysel.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
          <defs><linearGradient id="drop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#163F69"/><stop offset="1" stop-color="#071E3A"/></linearGradient><linearGradient id="bars" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0757C9"/><stop offset="1" stop-color="#1C9BF3"/></linearGradient></defs>
          <rect width="1024" height="1024" rx="220" fill="#F8FBFF"/>
          <path d="M395 112C315 258 205 383 205 553c0 170 117 292 265 292 45 0 86-11 122-30-107-37-180-139-180-260 0-132 70-253 164-374-58-47-118-69-181-69z" fill="url(#drop)"/>
          <path d="M300 690C331 525 403 350 535 194 435 375 380 534 372 690z" fill="#FFFFFF"/>
          <g fill="url(#bars)">
            <rect x="460" y="650" width="88" height="176" rx="14"/>
            <rect x="568" y="565" width="88" height="261" rx="14"/>
            <rect x="676" y="460" width="88" height="366" rx="14"/>
            <rect x="784" y="326" width="88" height="500" rx="14"/>
          </g>
          <path d="M458 607l110-83 108-104 111-132" fill="none" stroke="#178BE6" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M748 292h62v62" fill="none" stroke="#178BE6" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          SVG
          convert /tmp/promysel.svg -resize 1024x1024 assets/icon/app_icon.png
          cp assets/icon/app_icon.png assets/icon/app_icon_foreground.png
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          zip -qr "$GITHUB_WORKSPACE/artifacts/promysel-v1.27.0-source.zip" . -x 'android/*' 'build/*' '.dart_tool/*'
          unzip -t "$GITHUB_WORKSPACE/artifacts/promysel-v1.27.0-source.zip" >/dev/null

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies and analyze
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          rm -rf android
          flutter create --platforms=android --project-name promysel --org ru.promysel .
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' android/app/src/main/kotlin/ru/promysel/promysel/MainActivity.kt
          sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' android/app/src/main/kotlin/ru/promysel/promysel/MainActivity.kt
          sed -i '/<manifest/a\\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          sed -i 's/android:label="[^"]*"/android:label="Промысел"/' "$MANIFEST"
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          declare -A sizes=([mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192)
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            out="android/app/src/main/res/mipmap-$d"; mkdir -p "$out"
            convert assets/icon/app_icon.png -resize "${sizes[$d]}x${sizes[$d]}" "$out/ic_launcher.png"
            cp "$out/ic_launcher.png" "$out/ic_launcher_round.png"
          done
          sed -i 's#android:icon="[^"]*"#android:icon="@mipmap/ic_launcher"#' "$MANIFEST"
          if grep -q 'android:roundIcon=' "$MANIFEST"; then sed -i 's#android:roundIcon="[^"]*"#android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"; else sed -i 's#<application#<application android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"; fi

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/artifacts/promysel-v1.27.0-release.apk"
          unzip -t "$GITHUB_WORKSPACE/artifacts/promysel-v1.27.0-release.apk" >/dev/null
          sha256sum "$GITHUB_WORKSPACE/artifacts/promysel-v1.27.0-release.apk"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: promysel-v1.27.0-source
          path: artifacts/promysel-v1.27.0-source.zip
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: promysel-v1.27.0-android
          path: artifacts/promysel-v1.27.0-release.apk
          retention-days: 30
