name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Найти Flutter-проект
        id: project
        shell: bash
        run: |
          set -e
          PROJECT_DIR=$(find . -name pubspec.yaml -not -path './.git/*' -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Не найден pubspec.yaml"
            exit 1
          fi
          PROJECT_DIR=${PROJECT_DIR#./}
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Подготовить Android-платформу
        shell: bash
        run: |
          set -e
          cd "${{ steps.project.outputs.project_dir }}"
          if [ ! -f pubspec.yaml ]; then exit 1; fi
          # Генерируем/восстанавливаем стандартную Android-структуру Flutter.
          # Это устраняет ошибки отсутствующих Gradle Wrapper-файлов.
          flutter create --platforms=android --project-name oilman_app --org ru.oilman --overwrite .

      - name: Установить зависимости
        shell: bash
        run: |
          set -e
          cd "${{ steps.project.outputs.project_dir }}"
          flutter pub get

      - name: Проверить проект
        shell: bash
        run: |
          set -e
          cd "${{ steps.project.outputs.project_dir }}"
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Сгенерировать иконку
        shell: bash
        run: |
          set -e
          cd "${{ steps.project.outputs.project_dir }}"
          dart run flutter_launcher_icons

      - name: Собрать APK
        shell: bash
        env:
          OILMAN_API_URL: ${{ vars.OILMAN_API_URL || 'http://10.0.2.2:8000' }}
        run: |
          set -e
          cd "${{ steps.project.outputs.project_dir }}"
          flutter clean
          flutter pub get
          flutter build apk --release --dart-define=OILMAN_API_URL="$OILMAN_API_URL"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/artifacts/oilman-app-v1.1-release.apk"

      - name: Опубликовать APK
        uses: actions/upload-artifact@v4
        with:
          name: oilman-app-android
          path: artifacts/oilman-app-v1.1-release.apk
          if-no-files-found: error
          retention-days: 30
