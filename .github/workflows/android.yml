name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы из GitHub
        uses: actions/checkout@v4

      - name: Найти Flutter-проект или ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Файлы репозитория ==='
          find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -not -path '*/.git/*' | sort | head -300

          PROJECT_DIR=""

          PUBSPEC="$(find "$GITHUB_WORKSPACE" -type f -name pubspec.yaml \
            -not -path '*/.git/*' \
            -not -path '*/.build_project/*' \
            -print -quit || true)"

          if [ -n "$PUBSPEC" ]; then
            PROJECT_DIR="$(dirname "$PUBSPEC")"
            echo "Найден распакованный Flutter-проект: $PROJECT_DIR"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -type f -iname '*.zip' \
              -not -path '*/.git/*' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2- || true)"

            if [ -n "$ZIP_FILE" ]; then
              echo "Найден ZIP: $ZIP_FILE"
              rm -rf "$RUNNER_TEMP/oilman_project"
              mkdir -p "$RUNNER_TEMP/oilman_project"
              unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/oilman_project"

              PUBSPEC="$(find "$RUNNER_TEMP/oilman_project" -type f -name pubspec.yaml -print -quit || true)"
              if [ -n "$PUBSPEC" ]; then
                PROJECT_DIR="$(dirname "$PUBSPEC")"
                echo "Flutter-проект внутри ZIP: $PROJECT_DIR"
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo 'ОШИБКА: pubspec.yaml не найден.'
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Итоговый проект: $PROJECT_DIR"

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Проверить Flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter --version

      - name: Пересоздать чистую Android-конфигурацию
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"

          echo 'Удаляем старую Android-конфигурацию...'
          rm -rf android

          echo 'Создаём Android-конфигурацию Flutter...'
          flutter create \
            --platforms=android \
            --project-name oilman_app \
            --org ru.oilman \
            .

          echo 'Устанавливаем название приложения: Нефтяник'
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="[^"]*"/android:label="Нефтяник"/' android/app/src/main/AndroidManifest.xml || true
          fi

          echo 'Проверяем Android-файлы...'
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/build.gradle.kts
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew

          echo 'Android-конфигурация успешно создана.'
          echo '=== settings.gradle.kts ==='
          sed -n '1,140p' android/settings.gradle.kts
          echo '=== app/build.gradle.kts ==='
          sed -n '1,180p' android/app/build.gradle.kts

      - name: Установить зависимости
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          flutter pub get

      - name: Проверить Dart-код
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          dart analyze --no-fatal-infos

      - name: Сгенерировать иконку приложения
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          if [ -f assets/icon/app_icon.png ]; then
            dart run flutter_launcher_icons
          fi

      - name: Собрать release APK
        shell: bash
        env:
          OILMAN_API_URL: ${{ vars.OILMAN_API_URL || 'http://127.0.0.1:8000' }}
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"

          flutter clean
          flutter pub get
          flutter build apk --release --dart-define=OILMAN_API_URL="$OILMAN_API_URL"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "$GITHUB_WORKSPACE/artifacts/neftyanik-v1.4-offline-release.apk"

          echo '=== APK ==='
          ls -lh "$GITHUB_WORKSPACE/artifacts/neftyanik-v1.4-offline-release.apk"

      - name: Опубликовать APK
        uses: actions/upload-artifact@v4
        with:
          name: oilman-app-android
          path: artifacts/neftyanik-v1.4-offline-release.apk
          if-no-files-found: error
          retention-days: 30
