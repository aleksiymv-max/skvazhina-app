name: Build Promysel APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: promysel-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Promysel Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract base source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/neftyanik_v1.24.1_stable_hotfix.zip"
          DIR="$RUNNER_TEMP/promysel"
          rm -rf "$DIR" && mkdir -p "$DIR"
          unzip -q "$SRC" -d "$DIR"
          PROJECT="$(dirname "$(find "$DIR" -name pubspec.yaml -print -quit)")"
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Apply v1.25 changes
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v125.py"
          cat > /tmp/promysel.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
          <rect width="1024" height="1024" rx="210" fill="#f8fbff"/>
          <path d="M512 95C430 245 250 365 250 565c0 166 117 292 262 292s262-126 262-292C774 365 594 245 512 95z" fill="#0787ef"/>
          <path d="M512 95c55 133 205 283 205 470 0 130-82 228-205 267V95z" fill="#111c2b"/>
          <path d="M170 760c175-75 440-71 684 0-211 58-472 60-684 0z" fill="#0755a5"/>
          <g stroke="#fff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M512 350v335M405 475h214M405 475v115M619 475v115"/><circle cx="405" cy="475" r="55"/><circle cx="619" cy="475" r="55"/><circle cx="512" cy="370" r="44"/><path d="M455 685h114M470 590h84M470 685v-95M554 685v-95"/></g>
          </svg>
          SVG
          convert /tmp/promysel.svg -resize 1024x1024 assets/icon/app_icon.png
          cp assets/icon/app_icon.png assets/icon/app_icon_foreground.png
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          zip -qr "$GITHUB_WORKSPACE/artifacts/promysel-v1.25.0-source.zip" . -x 'android/*' 'build/*' '.dart_tool/*'
          unzip -t "$GITHUB_WORKSPACE/artifacts/promysel-v1.25.0-source.zip" >/dev/null

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies and analyze
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          rm -rf android
          flutter create --platforms=android --project-name promysel --org ru.promysel .
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="Промысел"/' "$MANIFEST"
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          declare -A sizes=([mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192)
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            out="android/app/src/main/res/mipmap-$d"; mkdir -p "$out"
            convert assets/icon/app_icon.png -resize "${sizes[$d]}x${sizes[$d]}" "$out/ic_launcher.png"
            cp "$out/ic_launcher.png" "$out/ic_launcher_round.png"
          done
          sed -i 's#android:icon="[^"]*"#android:icon="@mipmap/ic_launcher"#' "$MANIFEST"
          if grep -q 'android:roundIcon=' "$MANIFEST"; then sed -i 's#android:roundIcon="[^"]*"#android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"; else sed -i 's#<application#<application android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"; fi

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/artifacts/promysel-v1.25.0-release.apk"
          unzip -t "$GITHUB_WORKSPACE/artifacts/promysel-v1.25.0-release.apk" >/dev/null
          sha256sum "$GITHUB_WORKSPACE/artifacts/promysel-v1.25.0-release.apk"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: promysel-v1.25.0-source
          path: artifacts/promysel-v1.25.0-source.zip
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: promysel-v1.25.0-android
          path: artifacts/promysel-v1.25.0-release.apk
          retention-days: 30
