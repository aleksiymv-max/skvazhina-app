name: Build Promysel APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: promysel-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Promysel Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract base source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/neftyanik_v1.24.1_stable_hotfix.zip"
          DIR="$RUNNER_TEMP/promysel"
          rm -rf "$DIR" && mkdir -p "$DIR"
          unzip -q "$SRC" -d "$DIR"
          PROJECT="$(dirname "$(find "$DIR" -name pubspec.yaml -print -quit)")"
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Install image tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin

      - name: Apply Promysel updates
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v125.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v126.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v127.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v128.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v129.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v129_walk.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v129_problems.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v130.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v131.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v132.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v133.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v134.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v135.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v136.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v136_fix.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v137.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v137_corrections.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v138_problem_actions.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v139_problem_layout.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v140_problem_card.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v140_closed_lists.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v141_parameter_sync.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v142_user_fixes.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v143_exact_walk_and_dispatcher.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v144_requested_fixes.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v145.py"
          python3 "$GITHUB_WORKSPACE/tools/prepare_promysel_v146.py"
          python3 - <<'PY'
          from pathlib import Path
          w=Path('lib/features/wells/well_screen.dart').read_text(); h=Path('lib/features/home/home_screen.dart').read_text(); p=Path('lib/features/organization/personnel_screen.dart').read_text()
          pad=Path('lib/features/walk/pad_walk_card_screen.dart').read_text(); wa=Path('lib/features/walk/walk_area_screen.dart').read_text()
          hs=Path('lib/features/history/history_screen.dart').read_text(); wc=Path('lib/features/wells/well_card_screen.dart').read_text(); aps=Path('lib/core/services/annulus_pressure_store.dart').read_text()
          checks={
            'throttle_place':all(k in w for k in ["Место дросселирования","Трубное пространство","Затрубное пространство"]),
            'problem_reset_code':"problem" in w,
            'configured_walk_fields':all(k in w for k in ["showP('rtr')","showP('rz')","showP('rline')","showP('esp_f')","showP('esp_i')","showP('esp_load')","showP('esp_rins')"]),
            'dispatcher_application':"Подать заявку" in h and "ItrSubrole.dispatcher" in h,
            'operator_personnel':"UserRole.operator||user.role==UserRole.admin" in h,
            'personnel_avatar':("leading:_avatar(u)" in p or "leading: _avatar(u)" in p or "CircleAvatar" in p),
            'application_date_text':"Заявка подана" in h,
            'resolve_action':"Решено" in h,
            'mkd_walk_button':"Внести показания" in pad,
            'walk_units':"кг/сут" in wa,
            'history_mkd_label':"Межколонные давления" in hs,
            'history_mkd_export':"createAnnulusJournalXlsx" in hs,
            'well_latest':"Последние введённые значения" in wc,
            'trend_legend':"_TrendPainter.palette" in wc,
            'mkd_persistent':"SharedPreferences" in aps,
            'mkd_history':"history({String? wellId})" in aps,
          }
          print('v1.46 checks:',checks,flush=True)
          failed=[k for k,v in checks.items() if not v]
          assert not failed, 'Missing v1.46 features: '+', '.join(failed)
          print('v1.46 generated-source assertions passed')
          PY
          cp "$GITHUB_WORKSPACE/assets/promysel_icon_v131.png" assets/icon/app_icon.png
          cp "$GITHUB_WORKSPACE/assets/promysel_icon_v131.png" assets/icon/app_icon_foreground.png
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          zip -qr "$GITHUB_WORKSPACE/artifacts/promysel-v1.46.0-source.zip" . -x 'android/*' 'build/*' '.dart_tool/*'
          unzip -t "$GITHUB_WORKSPACE/artifacts/promysel-v1.46.0-source.zip" >/dev/null

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies and analyze
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Role and UX preflight
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          python3 - <<'PY'
          from pathlib import Path
          home=Path('lib/features/home/home_screen.dart').read_text()
          walk=Path('lib/features/walk/pad_walk_card_screen.dart').read_text()
          hist=Path('lib/features/history/history_screen.dart').read_text()
          card=Path('lib/features/wells/well_card_screen.dart').read_text()
          checks={
            'dispatcher_can_file': 'Подать заявку' in home and 'ItrSubrole.dispatcher' in home,
            'dispatcher_can_resolve': 'Решено' in home and 'if(!dispatcher)' not in home,
            'filed_date_visible': 'Заявка подана' in home and '_problemDate' in home,
            'mkd_walk_standard_action': "FilledButton.icon(onPressed:()=>_annulus" in walk and "label:const Text('Внести показания')" in walk,
            'journal_names': all(s in hist for s in ["Text('Журнал заданий')","Text('Журнал проблем')","Text('Межколонные давления')"]),
            'no_export_word': all(s not in hist for s in ["Выгрузить журнал заданий","Выгрузить журнал проблем","Выгрузить Межколонные давления"]),
            'mkd_not_fourth_tab': 'length: 4' not in hist and "Tab(text:'Межколонные давления')" not in hist,
            'mkd_inside_parameters': '_annulusParametersBlock()' in hist,
            'mkd_export_functional': 'createAnnulusJournalXlsx' in hist,
            'well_card_readonly_latest': 'Последние введённые значения' in card and '_latestCard()' in card,
            'well_card_walk_config': 'WalkParameterConfig.instance.unit' in card,
          }
          print('ROLE/UX PREFLIGHT',checks,flush=True)
          bad=[k for k,v in checks.items() if not v]
          assert not bad, 'Preflight failed: '+', '.join(bad)
          PY

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          rm -rf android
          flutter create --platforms=android --project-name promysel --org ru.promysel .
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' android/app/src/main/kotlin/ru/promysel/promysel/MainActivity.kt
          sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' android/app/src/main/kotlin/ru/promysel/promysel/MainActivity.kt
          sed -i '/<manifest/a\\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          sed -i 's/android:label="[^"]*"/android:label="Промысел"/' "$MANIFEST"
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          declare -A sizes=([mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192)
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            out="android/app/src/main/res/mipmap-$d"; mkdir -p "$out"
            convert assets/icon/app_icon.png -resize "${sizes[$d]}x${sizes[$d]}" "$out/ic_launcher.png"
            cp "$out/ic_launcher.png" "$out/ic_launcher_round.png"
          done
          sed -i 's#android:icon="[^"]*"#android:icon="@mipmap/ic_launcher"#' "$MANIFEST"
          if grep -q 'android:roundIcon=' "$MANIFEST"; then sed -i 's#android:roundIcon="[^"]*"#android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"; else sed -i 's#<application#<application android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"; fi

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/artifacts/promysel-v1.46.0-release.apk"
          unzip -t "$GITHUB_WORKSPACE/artifacts/promysel-v1.46.0-release.apk" >/dev/null
          sha256sum "$GITHUB_WORKSPACE/artifacts/promysel-v1.46.0-release.apk"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: promysel-v1.46.0-source
          path: artifacts/promysel-v1.46.0-source.zip
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: promysel-v1.46.0-android
          path: artifacts/promysel-v1.46.0-release.apk
          retention-days: 30
