name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Files in repository ==="
          find . -maxdepth 5 -type f | sort | head -300 || true

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE" -type f -name pubspec.yaml -not -path '*/.git/*' -print -quit | xargs -r dirname || true)"

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -type f \( -iname '*.zip' \) -not -path '*/.git/*' -printf '%s %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2- || true)"
            if [ -n "$ZIP_FILE" ]; then
              echo "Found ZIP: $ZIP_FILE"
              rm -rf "$RUNNER_TEMP/oilman_project"
              mkdir -p "$RUNNER_TEMP/oilman_project"
              unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/oilman_project"
              PROJECT_DIR="$(find "$RUNNER_TEMP/oilman_project" -type f -name pubspec.yaml -print -quit | xargs -r dirname || true)"
            fi
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml was not found."
            echo "The repository must contain the Flutter project directly or a ZIP containing pubspec.yaml."
            echo "=== ZIP files ==="
            find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print || true
            echo "=== pubspec.yaml files ==="
            find "$GITHUB_WORKSPACE" -type f -name pubspec.yaml -not -path '*/.git/*' -print || true
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          echo "Flutter project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            flutter create --platforms=android --project-name oilman_app --org ru.oilman .
          fi
          chmod +x android/gradlew || true

      - name: Get dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          flutter pub get

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          flutter clean
          flutter pub get
          flutter build apk --release
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/artifacts/oilman-app-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oilman-app-android
          path: artifacts/oilman-app-release.apk
          if-no-files-found: error
          retention-days: 30
