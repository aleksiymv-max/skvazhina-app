name: One-shot configure Promysel SMTP using existing secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/ci/smtp-secure-activation.trigger'

permissions:
  contents: read

concurrency:
  group: one-shot-promysel-smtp
  cancel-in-progress: false

jobs:
  inspect-and-configure:
    if: github.repository == 'aleksiymv-max/skvazhina-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline Python test and syntax verification
        run: |
          python3 -m py_compile infra/smtp/configure_supabase_smtp.py infra/smtp/autoconfigure_existing_secrets.py
          python3 -m unittest discover -s infra/smtp -p 'test_*.py' -v
      - name: Discover previously saved secret names and configure if complete
        shell: bash
        env:
          GH_SMTP_PROMYSEL_SMTP_USER: ${{ secrets.PROMYSEL_SMTP_USER }}
          GH_SMTP_GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GH_SMTP_GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GH_SMTP_SMTP_USER: ${{ secrets.SMTP_USER }}
          GH_SMTP_SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          GH_SMTP_SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          GH_SMTP_EMAIL_USER: ${{ secrets.EMAIL_USER }}
          GH_SMTP_EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          GH_SMTP_MAIL_USER: ${{ secrets.MAIL_USER }}
          GH_SMTP_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          GH_SMTP_MAIL_EMAIL: ${{ secrets.MAIL_EMAIL }}
          GH_SMTP_GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GH_SMTP_GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GH_SMTP_PROMYSEL_EMAIL: ${{ secrets.PROMYSEL_EMAIL }}
          GH_SMTP_PROMYSEL_EMAIL_USER: ${{ secrets.PROMYSEL_EMAIL_USER }}
          GH_SMTP_PROMYSEL_SMTP_PASSWORD: ${{ secrets.PROMYSEL_SMTP_PASSWORD }}
          GH_SMTP_GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GH_SMTP_GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          GH_SMTP_SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          GH_SMTP_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GH_SMTP_SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GH_SMTP_EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          GH_SMTP_EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GH_SMTP_EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          GH_SMTP_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GH_SMTP_MAIL_PASS: ${{ secrets.MAIL_PASS }}
          GH_SMTP_GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GH_SMTP_PROMYSEL_EMAIL_PASSWORD: ${{ secrets.PROMYSEL_EMAIL_PASSWORD }}
          GH_SMTP_PROMYSEL_EMAIL_APP_PASSWORD: ${{ secrets.PROMYSEL_EMAIL_APP_PASSWORD }}
          GH_SMTP_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_SMTP_SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          GH_SMTP_SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          GH_SMTP_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          GH_SMTP_SUPABASE_PERSONAL_ACCESS_TOKEN: ${{ secrets.SUPABASE_PERSONAL_ACCESS_TOKEN }}
          GH_SMTP_SB_ACCESS_TOKEN: ${{ secrets.SB_ACCESS_TOKEN }}
          GH_SMTP_SB_MANAGEMENT_TOKEN: ${{ secrets.SB_MANAGEMENT_TOKEN }}
          GH_SMTP_PROMYSEL_SMTP_HOST: ${{ secrets.PROMYSEL_SMTP_HOST }}
          GH_SMTP_SMTP_HOST: ${{ secrets.SMTP_HOST }}
          GH_SMTP_MAIL_HOST: ${{ secrets.MAIL_HOST }}
          GH_SMTP_PROMYSEL_SMTP_PORT: ${{ secrets.PROMYSEL_SMTP_PORT }}
          GH_SMTP_SMTP_PORT: ${{ secrets.SMTP_PORT }}
          GH_SMTP_MAIL_PORT: ${{ secrets.MAIL_PORT }}
          GH_SMTP_PROMYSEL_SMTP_FROM: ${{ secrets.PROMYSEL_SMTP_FROM }}
          GH_SMTP_SMTP_FROM: ${{ secrets.SMTP_FROM }}
          GH_SMTP_MAIL_FROM: ${{ secrets.MAIL_FROM }}
          GH_SMTP_EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          set -euo pipefail
          python3 infra/smtp/autoconfigure_existing_secrets.py
