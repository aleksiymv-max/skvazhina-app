name: One-shot verify duplicate invitation password safety
on:
  push:
    branches: [main]
    paths:
      - 'deploy/ci/invite-password-v212-smoke.trigger'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check all password safety routes and landing JS syntax
        run: |
          set -euo pipefail
          python3 server/test_registration_password_reinvite_v212.py
          python3 tools/test_registration_password_landing_v212.py
          python3 - <<'PY'
          from pathlib import Path
          html=Path("docs/finish-registration.html").read_text(encoding="utf8")
          assert html.count("<script>")==1 and html.count("</script>")==1
          js=html.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/promysel-v212-invite.js").write_text(js,encoding="utf8")
          print("PASS: isolated invitation landing script for Node validation")
          PY
          node --check /tmp/promysel-v212-invite.js
          node tools/test_registration_landing_runtime_v212.js
          echo 'PASS: valid JavaScript and repeat-invite flows; no emails or account changes'
