name: "Timeweb Cloud — пакет рабочей версии без VPN"
on:
  workflow_dispatch:
    inputs:
      stable_run_id:
        description: "Успешная Web-сборка утверждённого stable (сейчас: 41800117647)"
        required: true
        default: "41800117647"
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify released stable commit and download its exact artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.stable_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /tmp/promysel-stable-run.json
          jq -e '.conclusion=="success" and .name=="Build Promysel Web for iPhone" and .event!="pull_request"' /tmp/promysel-stable-run.json
          RELEASE_SHA="$(jq -r .head_sha /tmp/promysel-stable-run.json)"
          STABLE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/stable" --jq '.object.sha')"
          if [[ "$RELEASE_SHA" != "$STABLE_SHA" ]]; then
            echo "::error::Selected build is not the approved stable commit. Refusing to deploy development."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/web-artifact" "$RUNNER_TEMP/web" "$RUNNER_TEMP/bundle/deploy"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n promysel-original-flutter-supabase-web -D "$RUNNER_TEMP/web-artifact"
          unzip -q "$RUNNER_TEMP/web-artifact/promysel-original-flutter-supabase-web.zip" -d "$RUNNER_TEMP/web"
          echo "Verified stable commit: $STABLE_SHA"
      - name: Rewrite public Supabase URLs to same-origin API gateway
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/vpnfree/prepare_mirror.py --source "$RUNNER_TEMP/web" --output "$RUNNER_TEMP/bundle/site"
          cp deploy/vpnfree/nginx-site.template deploy/vpnfree/install-ubuntu.sh deploy/vpnfree/check-access.sh "$RUNNER_TEMP/bundle/deploy/"
          cp deploy/vpnfree/README.txt "$RUNNER_TEMP/bundle/README.txt"
          test -f "$RUNNER_TEMP/bundle/site/main.dart.js"
          ! grep -q 'promysel-dev-mark\|promysel-channel-indicator' "$RUNNER_TEMP/bundle/site/index.html"
          if grep -r -l -F 'https://xptmcufhuvtcunqzlsme.supabase.co' "$RUNNER_TEMP/bundle/site" --include='*.js' --include='*.html' --include='*.json'; then
            echo '::error::Direct blocked origin still found in Web bundle';exit 1
          fi
          (cd "$RUNNER_TEMP/bundle" && zip -qr "$GITHUB_WORKSPACE/promysel-vpnfree-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: promysel-vpnfree-web-deployment
          path: promysel-vpnfree-web.zip
          retention-days: 14