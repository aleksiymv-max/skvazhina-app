<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082a54"><title>Промысел — создание администратора</title>
<style>*,*:before,*:after{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#041a35,#0b3a75 70%,#0074ad);color:#ecf7ff;font:16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,480px);border:1px solid #49a1d9;border-radius:24px;background:#092746;padding:28px;box-shadow:0 20px 60px #0005}h1{font-size:28px;margin:0 0 10px}p{color:#aacde7;line-height:1.5}label{display:block;margin:18px 0 8px;font-weight:650}input{width:100%;border:1px solid #5d96bf;border-radius:12px;background:#fff;color:#082a54;font:inherit;padding:14px}button{border:0;border-radius:12px;background:#ff8716;color:#071d34;padding:15px 20px;font-weight:800;font:inherit;margin:23px 0 0;width:100%;cursor:pointer}button:disabled{opacity:.6}#status{white-space:pre-line;padding-top:8px}small{color:#83b6da;display:block;margin-top:15px}</style></head>
<body><main class="card"><h1>Промысел · Первый запуск</h1><p>Создание единственного системного администратора в Supabase. Этот экран работает только один раз.</p><p><b>Логин:</b> admin@promysel.local</p><form id="form"><label for="code">Одноразовый код настройки</label><input id="code" type="password" minlength="20" maxlength="200" autocomplete="off" required><label for="temp">Временный пароль (не менее 16 символов)</label><input id="temp" type="password" minlength="16" maxlength="120" autocomplete="new-password" required><button type="submit" id="submit">Создать администратора</button></form><div id="status" role="status" aria-live="polite"></div><small>После создания войдите в приложение и замените временный пароль. Не передавайте код и пароль другим.</small></main><script>
const form=document.getElementById('form'),status=document.getElementById('status'),button=document.getElementById('submit');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.textContent='Создание администратора…';
try{const response=await fetch('https://xptmcufhuvtcunqzlsme.supabase.co/functions/v1/promysel-bootstrap-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value,temporaryPassword:document.getElementById('temp').value}),cache:'no-store'});const result=await response.json();if(!response.ok)throw Error(result.detail||'Ошибка сервера');status.textContent='Администратор создан. Откройте «Промысел», войдите и смените временный пароль.';document.getElementById('code').value='';document.getElementById('temp').value='';}catch(err){status.textContent='Не удалось создать администратора: '+err.message;}finally{button.disabled=false}});
</script></body></html>
