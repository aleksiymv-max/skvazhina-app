async function request(url,method="GET",payload,authenticated=true,repeat=true){
  const headers={"apikey":KEY,"Content-Type":"application/json"};
  if(authenticated&&session?.access_token)headers.Authorization="Bearer "+session.access_token;
  const response=await fetch(url,{method,headers,body:payload===undefined?undefined:JSON.stringify(payload),cache:"no-store"});
  if(response.status===401&&authenticated&&repeat&&session?.refresh_token&&await refreshToken())return request(url,method,payload,authenticated,false);
  const str=await response.text();let body={};try{body=str?JSON.parse(str):{}}catch(_){body={message:str.slice(0,160)}}
  if(!response.ok)throw Error(body.msg||body.message||body.error_description||body.detail||body.error||("HTTP "+response.status));
  return body;
}

 let subrole=null;
 if(role==="engineer"){subrole=prompt("Специализация: master, geologist, leadingGeologist, technologist, leadingTechnologist","master");if(subrole===null)return}
 if(!confirm("Подтвердить изменение должности?"))return;
 try{await adminCall("change-role","POST",{fieldId:field.id,userId,role,subrole});note("Должность изменена");await reload()}
 catch(err){note(err.message,true)}
}
async function toggleBlock(userId,blocked){
 if(!confirm(blocked?"Заблокировать доступ сотрудника? Его история сохранится.":"Разблокировать сотрудника?"))return;
 try{await adminCall("block-worker","POST",{fieldId:field.id,userId,blocked});note("Статус сотрудника изменён");await reload()}
 catch(err){note(err.message,true)}
}
function selectedWell(){return data.wells.find(x=>x.id===val("selectedWell"))}
function displayWell(w){return esc(w?.well_number||w?.id||"—")}
function choices(items,fmt){return items.map(i=>'<option value="'+esc(i.id)+'">'+esc(fmt(i))+'</option>').join("")}
function nav(){
 document.getElementById("topAction").innerHTML='<button onclick="logout()">Выйти</button>';
 TABS.hidden=false;
 const links=isSystemAdmin()&&!member?[["approvals","Заявки"]]:[["dashboard","Главная"],["wells","Скважины"],["walk","Обход"],["history","История"],["problems","Проблемы"],["tasks","Задания"],["people","Персонал"]];
 if(myRole()==="shopChief")links.push(["approvals","Заявки"]);
 TABS.innerHTML=links.map(k=>'<button class="'+(view===k[0]?"active":"")+'" onclick="tab(\''+k[0]+'\')">'+k[1]+'</button>').join("");
}
function render(){
 if(!member&&!isSystemAdmin()){authScreen();return}
 nav();
 let content="";
 if(view==="dashboard")content=dashboard();
 if(view==="wells")content=wellsPage();
 if(view==="walk")content=walkPage();
 if(view==="history")content=historyPage();
 if(view==="problems")content=recordsPage("problem");
 if(view==="tasks")content=recordsPage("task");
 if(view==="people")content=peoplePage();
 if(view==="approvals")content=approvalsPage();
 APP.innerHTML='<div class="section-head"><div><h1>'+({dashboard:"Обзор месторождения",wells:"Участки и скважины",walk:"Обход скважин",history:"История замеров",problems:"Проблемы",tasks:"Задания",people:"Персонал",approvals:"Заявки на согласование"})[view]+'</h1><p class="sub">'+esc(field.name)+' · '+esc(roleLabel())+(subRole()?" · "+esc(subRole()):"")+'</p></div><span class="pill">Supabase</span></div>'+
 '<div class="notice">Данные сохраняются в новую базу Supabase. Прежняя база Beget не используется.</div>'+content+
 '<div class="footer">Промысел Cloud · предварительная проверка · '+esc(field.id)+'</div>';
}
function dashboard(){
 const problems=data.records.filter(x=>x.kind==="problem"&&x.payload?.status!=="resolved");
 const tasks=data.records.filter(x=>x.kind==="task"&&x.payload?.status!=="done");
 return '<div class="cols3"><div class="metric"><b>'+data.areas.length+'</b><span>Участков</span></div><div class="metric"><b>'+data.pads.length+'</b><span>Кустов</span></div><div class="metric"><b>'+data.wells.length+'</b><span>Скважин</span></div><div class="metric"><b>'+data.walks.length+'</b><span>Замеров</span></div><div class="metric"><b>'+problems.length+'</b><span>Проблем</span></div><div class="metric"><b>'+tasks.length+'</b><span>Заданий</span></div></div>'+
 '<div class="card" style="margin-top:15px"><h2>Последние обходы</h2>'+
 (data.walks.length?data.walks.slice(0,6).map(m=>'<div class="item"><strong>Скважина '+displayWell(data.wells.find(w=>w.id===m.well_id))+'</strong><div class="sub">'+date(m.measured_at)+' · Ртр: '+esc(m.payload?.rtr??"—")+' · Рз: '+esc(m.payload?.rz??"—")+'</div></div>').join(""):'<div class="empty">В новой базе пока нет записей обходов.</div>')+
 '</div>';
}
function wellsPage(){
 let x='<div class="card"><h2>Структура месторождения</h2>';
 if(!data.areas.length)x+='<div class="empty">Участки ещё не добавлены.</div>';
 for(const a of data.areas){
  const pads=data.pads.filter(p=>p.area_id===a.id);
  x+='<div class="item"><strong>'+esc(a.name)+'</strong><div class="sub">'+pads.length+' кустовых площадок</div>';
  for(const p of pads){
   const wells=data.wells.filter(w=>w.pad_id===p.id);
   x+='<div class="item" style="background:#f8fbff"><b>КП '+esc(p.name)+'</b><div class="sub">'+esc(p.kind)+'</div>';
   x+=wells.map(w=>'<div class="sub" style="padding:7px;border-bottom:1px solid #e2e8f0">Скв. '+esc(w.well_number)+' · '+esc(w.well_type)+' · '+esc(w.status||"")+'</div>').join("");
   x+='</div>';
  }
  x+='</div>';
 }
 x+='</div>';
 if(canStructure()){
  x+='<div class="card"><h2>Добавить участок</h2><form onsubmit="saveArea(event)" class="row"><input id="areaName" placeholder="Название участка" required style="flex:2;min-width:160px"><button class="btn">Создать</button></form></div>';
  x+='<div class="card"><h2>Добавить куст</h2><form onsubmit="savePad(event)" class="stack"><div><label>Участок</label><select id="padArea" required>'+choices(data.areas,a=>a.name)+'</select></div><div><label>Название КП</label><input id="padName" required placeholder="КП 3А02"></div><div><label>Тип</label><select id="padKind"><option value="oil">Нефтяной</option><option value="gasCondensate">Газоконденсатный</option></select></div><button class="btn">Добавить куст</button></form></div>';
  x+='<div class="card"><h2>Добавить скважину</h2><form onsubmit="saveWell(event)" class="stack"><div><label>Кустовая площадка</label><select id="wellPad" required>'+choices(data.pads,p=>p.name)+'</select></div><div><label>Номер скважины</label><input id="wellNumber" required placeholder="3А021"></div><div><label>Тип скважины</label><select id="wellType"><option value="oil">Нефтяная</option><option value="gasCondensate">Газоконденсатная</option></select></div><button class="btn">Добавить скважину</button></form></div>';
 }
 return x;
}
async function saveArea(e){e.preventDefault();try{await rest("production_areas","POST",{id:id(),field_id:field.id,name:val("areaName")});note("Участок создан");await reload()}catch(err){note(err.message,true)}}
async function savePad(e){e.preventDefault();try{await rest("pads","POST",{id:id(),field_id:field.id,area_id:val("padArea"),name:val("padName"),kind:val("padKind")});note("Куст создан");await reload()}catch(err){note(err.message,true)}}
async function saveWell(e){e.preventDefault();try{await rest("wells","POST",{id:id(),field_id:field.id,pad_id:val("wellPad"),well_number:val("wellNumber"),well_type:val("wellType")});note("Скважина добавлена");await reload()}catch(err){note(err.message,true)}}
function walkPage(){
 if(!canWalk())return '<div class="notice warn">Роль диспетчера не позволяет вносить показания скважин.</div>';
 return '<div class="card"><h2>Новый замер</h2>'+
 (data.wells.length?'<form onsubmit="saveWalk(event)" class="stack"><div><label>Скважина</label><select id="selectedWell" required>'+choices(data.wells,w=>"Скв. "+w.well_number+" — "+(data.pads.find(p=>p.id===w.pad_id)?.name||""))+'</select></div>'+
 '<div class="cols"><div><label>Ртр</label><input id="rtr" inputmode="decimal" placeholder="МПа или кгс/см²"></div><div><label>Рз</label><input id="rz" inputmode="decimal" placeholder="Давление"></div><div><label>Рлин</label><input id="rline" inputmode="decimal"></div><div><label>Т устья, °C</label><input id="temp" inputmode="decimal"></div></div>'+
 '<div><label>Штуцер / дроссель</label><input id="choke" placeholder="Значение и единица"></div><div><label>Замечания</label><textarea id="walkNote"></textarea></div><button class="btn">Сохранить замер в Supabase</button></form>':
 '<div class="empty">Сначала необходимо создать скважину.</div>')+'</div>';
}
async function saveWalk(e){
 e.preventDefault();try{
  const w=selectedWell();if(!w)throw Error("Скважина не выбрана");
  const payload={rtr:num("rtr"),rz:num("rz"),rline:num("rline"),t_before:num("temp"),
    choke:val("choke"),note:val("walkNote"),well_number:w.well_number,well_type:w.well_type,
    captured_parameters:["rtr","rz","rline","t_before","choke"],captured_at:new Date().toISOString()};
  for(const k of ["rtr","rz","rline","t_before"])if(payload[k]!==null&&!Number.isFinite(payload[k]))throw Error("Проверьте числовые значения");
  await rest("walk_measurements","POST",{id:id(),field_id:field.id,pad_id:w.pad_id,well_id:w.id,
    measured_at:new Date().toISOString(),payload,actor_id:user.id});
  note("Замер сохранён");await reload();view="history";render();
 }catch(err){note(err.message,true)}
}
function historyPage(){
 let x='<div class="card"><div class="section-head"><h2>Журнал обходов</h2>'+(canExport()?'<button class="btn ghost sm" onclick="exportHistory()">CSV</button>':"")+'</div>';
 if(!data.walks.length)x+='<div class="empty">Замеры пока не внесены.</div>';
 for(const m of data.walks){
  const well=data.wells.find(w=>w.id===m.well_id),p=m.payload||{};
  x+='<div class="item"><div class="between row"><b>Скв. '+displayWell(well)+'</b><span class="sub">'+date(m.measured_at)+'</span></div>'+
  '<div class="sub">Ртр: '+esc(p.rtr??"—")+' · Рз: '+esc(p.rz??"—")+' · Рлин: '+esc(p.rline??"—")+'</div>'+
  (p.note?'<div class="sub">'+esc(p.note)+'</div>':"")+
  (canCorrect()?'<button class="btn ghost sm" style="margin-top:9px" onclick="correctWalk(\''+esc(m.id)+'\')">Корректировать</button>':"")+'</div>';
 }
 return x+'</div>';
}
async function correctWalk(mId){
 if(!canCorrect())return;
 const m=data.walks.find(m=>m.id===mId);if(!m)return;
 const raw=prompt("Новое Ртр:",String(m.payload?.rtr??""));if(raw===null)return;
 const rtr=Number(raw.replace(",","."));if(!Number.isFinite(rtr)){note("Неверное давление",true);return}
 const reason=prompt("Причина корректировки (обязательно):","");if(reason===null)return;
 if(!reason.trim()){note("Укажи причину корректировки",true);return}
 try{
  await rest("walk_measurements?id=eq."+encodeURIComponent(m.id),"PATCH",
   {payload:{...m.payload,rtr},correction_reason:reason.trim()});
  note("Корректировка сохранена в журнале аудита");await reload();
 }catch(err){note(err.message,true)}
}
function recordsPage(kind){
 const plural=kind==="task"?"задания":"проблемы";
 const rows=data.records.filter(r=>r.kind===kind);
 const allowed=kind==="task"?canManage():canWalk();
 let x='<div class="card"><h2>Журнал: '+plural+'</h2>';
 if(!rows.length)x+='<div class="empty">Записей пока нет.</div>';
 for(const r of rows){
  const v=r.payload||{};
  x+='<div class="item"><div class="between row"><strong>'+esc(v.title||"Без названия")+'</strong><span class="pill '+(v.status==="resolved"||v.status==="done"?"":"wait")+'">'+esc(v.status||"active")+'</span></div>'+
  '<p class="sub">'+esc(v.description||"")+'</p><div class="sub">'+date(r.updated_at)+'</div>'+
  (kind==="task"&&canWalk()&&v.status!=="done"?'<button class="btn ghost sm" style="margin-top:8px" onclick="completeTask(\''+esc(r.id)+'\')">Задание выполнено</button>':"")+
  (kind==="problem"&&myRole()==="dispatcher"&&!v.applicationFiled&&v.status!=="resolved"?
   '<button class="btn ghost sm" style="margin-top:8px" onclick="fileApplication(\''+esc(r.id)+'\')">Подать заявку</button>':"")+
  (kind==="problem"&&v.applicationFiled?'<div class="sub" style="margin-top:6px">Заявка подана</div>':"")+
  (kind==="problem"&&canMarkProblems()&&v.status!=="resolved"?
   '<button class="btn ghost sm" style="margin-top:8px;margin-left:5px" onclick="closeRecord(\''+esc(r.id)+'\')">Проблема решена</button>':"")+
  '</div>';
 }
 x+='</div>';
 if(allowed)x+='<div class="card"><h2>Создать '+(kind==="task"?"задание":"проблему")+'</h2><form class="stack" onsubmit="saveRecord(event,\''+kind+'\')"><div><label>Заголовок</label><input id="recTitle" required></div><div><label>Описание</label><textarea id="recDesc" required></textarea></div><div><label>Скважина (необязательно)</label><select id="recWell"><option value="">Без скважины</option>'+choices(data.wells,w=>w.well_number)+'</select></div><button class="btn">Сохранить</button></form></div>';
 return x;
}
async function completeTask(taskId){
 if(!confirm("Отметить задание выполненным?"))return;
 try{await adminCall("task-complete","POST",{recordId:taskId});note("Задание выполнено");await reload()}
 catch(err){note(err.message,true)}
}
async function fileApplication(problemId){
 if(!confirm("Подать заявку по этой проблеме?"))return;
 try{await adminCall("problem-application","POST",{recordId:problemId});note("Заявка подана");await reload()}
 catch(err){note(err.message,true)}
}
async function saveRecord(e,kind){e.preventDefault();try{
  await rest("field_records","POST",{id:id(),field_id:field.id,kind,well_id:val("recWell")||null,
    created_by:user.id,payload:{title:val("recTitle"),description:val("recDesc"),status:"active",createdAt:new Date().toISOString()}});
  note("Запись создана");await reload();
 }catch(err){note(err.message,true)}
}
async function closeRecord(recId){
 const r=data.records.find(r=>r.id===recId);if(!r)return;
 if(!confirm("Подтвердить изменение статуса?"))return;
 try{await rest("field_records?id=eq."+encodeURIComponent(recId),"PATCH",
  {payload:{...r.payload,status:r.kind==="task"?"done":"resolved",resolvedAt:new Date().toISOString(),resolvedBy:user.id}});
  note("Статус изменён");await reload();
 }catch(err){note(err.message,true)}
}
function peoplePage(){
 let x='<div class="card"><h2>Сотрудники месторождения</h2>';
 if(!data.people.length)x+='<div class="empty">Сотрудники не найдены.</div>';
 for(const p of data.people)x+='<div class="item"><b>'+esc(p.display_name||p.user_id)+'</b><div class="sub">'+esc(p.role)+(p.subrole?" · "+esc(p.subrole):"")+' · '+(p.blocked?"заблокирован":p.approved?"допущен":"ожидает")+'</div>'+
 (canManagePeople()&&p.user_id!==user.id&&p.role!=="shopChief"&&p.role!=="admin"?
 '<div class="row" style="margin-top:10px"><button class="btn ghost sm" onclick="changeWorker(\''+esc(p.user_id)+'\')">Изменить роль</button>'+
 '<button class="btn '+(p.blocked?"ghost":"danger")+' sm" onclick="toggleBlock(\''+esc(p.user_id)+'\','+(!p.blocked)+')">'+(p.blocked?"Разблокировать":"Заблокировать")+'</button></div>':"")+'</div>';
 return x+'</div><div class="notice">Изменение ролей и блокировка проходят через защищённую серверную процедуру и аудит.</div>';
}
function exportHistory(){
 if(!canExport())return;
 const rows=[["Дата","Скважина","Ртр","Рз","Рлин","Температура","Примечание"]];
 for(const m of data.walks){const w=data.wells.find(x=>x.id===m.well_id),p=m.payload||{};rows.push([date(m.measured_at),w?.well_number||"",p.rtr??"",p.rz??"",p.rline??"",p.t_before??"",p.note??""])}
 const csv="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(";")).join("\r\n");
 const href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
 const a=document.createElement("a");a.href=href;a.download="promysel-history.csv";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1000);
}
(async()=>{try{session=JSON.parse(localStorage.getItem(LS)||"null");if(session?.access_token)await enter();else authScreen()}catch(err){clearSession();authScreen();note(err.message,true)}})();
</script></body></html>
